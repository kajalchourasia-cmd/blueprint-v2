<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6B746F"/></marker></defs>
<text x="70" y="102" text-anchor="start" font-family="Segoe UI, Arial" font-size="48" font-weight="600" fill="#17201C">End-to-End System Architecture</text>
<text x="70" y="141" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Control plane, evidence plane and durable state are intentionally separated</text>
<line x1="70" y1="165" x2="1850" y2="165" stroke="#C9D0CC" stroke-width="2"/>
<rect x="90" y="230" width="255" height="235" rx="22" fill="#E8F2ED" stroke="#176447" stroke-width="2"/>
<text x="118" y="282" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Founder UI</text>
<text x="118" y="327" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Streamlit landing,</text>
<text x="118" y="360" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">onboarding,</text>
<text x="118" y="393" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">dashboard and</text>
<text x="118" y="426" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">approvals</text>
<line x1="345" y1="348" x2="390" y2="348" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="405" y="230" width="255" height="235" rx="22" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="2"/>
<text x="433" y="282" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">API boundary</text>
<text x="433" y="327" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">JWT owner scope,</text>
<text x="433" y="360" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">contract</text>
<text x="433" y="393" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">validation and</text>
<text x="433" y="426" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">idempotency</text>
<line x1="660" y1="348" x2="705" y2="348" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="720" y="230" width="255" height="235" rx="22" fill="#EAF1F8" stroke="#2D5F8B" stroke-width="2"/>
<text x="748" y="282" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Supervisor</text>
<text x="748" y="327" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Loads snapshot</text>
<text x="748" y="360" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">and chooses the</text>
<text x="748" y="393" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">next eligible route</text>
<line x1="975" y1="348" x2="1020" y2="348" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1035" y="230" width="255" height="235" rx="22" fill="#F1EDF8" stroke="#6D5AA6" stroke-width="2"/>
<text x="1063" y="276" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="600" fill="#17201C">Planner / Scheduler</text>
<text x="1063" y="326" text-anchor="start" font-family="Segoe UI, Arial" font-size="24" font-weight="400" fill="#5F6B65">Creates</text>
<text x="1063" y="357" text-anchor="start" font-family="Segoe UI, Arial" font-size="24" font-weight="400" fill="#5F6B65">dependencies and</text>
<text x="1063" y="388" text-anchor="start" font-family="Segoe UI, Arial" font-size="24" font-weight="400" fill="#5F6B65">atomically claims</text>
<text x="1063" y="419" text-anchor="start" font-family="Segoe UI, Arial" font-size="24" font-weight="400" fill="#5F6B65">ready tasks</text>
<line x1="1290" y1="348" x2="1335" y2="348" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1350" y="230" width="255" height="235" rx="22" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="2"/>
<text x="1378" y="282" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Specialists</text>
<text x="1378" y="327" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Foundation plus</text>
<text x="1378" y="360" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">customer,</text>
<text x="1378" y="393" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">competitor and</text>
<text x="1378" y="426" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">market research</text>
<line x1="1605" y1="348" x2="1650" y2="348" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1665" y="230" width="255" height="235" rx="22" fill="#FBF3DD" stroke="#9A6A14" stroke-width="2"/>
<text x="1693" y="282" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Decision layer</text>
<text x="1693" y="327" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Evidence Audit →</text>
<text x="1693" y="360" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Verdict → Quality</text>
<text x="1693" y="393" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Critic → HITL</text>
<rect x="140" y="620" width="470" height="190" rx="22" fill="#FFFFFF" stroke="#176447" stroke-width="2"/>
<text x="168" y="672" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Supabase — system of record</text>
<text x="168" y="715" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#5F6B65">Owner-isolated projects, runs, tasks,</text>
<text x="168" y="744" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#5F6B65">checkpoints, evidence, decisions, errors</text>
<text x="168" y="773" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#5F6B65">and immutable Blueprint versions.</text>
<rect x="725" y="620" width="470" height="190" rx="22" fill="#FFFFFF" stroke="#2D5F8B" stroke-width="2"/>
<text x="753" y="672" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Research and model services</text>
<text x="753" y="716" text-anchor="start" font-family="Segoe UI, Arial" font-size="24" font-weight="400" fill="#5F6B65">You.com supplies bounded discovery.</text>
<text x="753" y="747" text-anchor="start" font-family="Segoe UI, Arial" font-size="24" font-weight="400" fill="#5F6B65">Nebius performs structured extraction,</text>
<text x="753" y="778" text-anchor="start" font-family="Segoe UI, Arial" font-size="24" font-weight="400" fill="#5F6B65">synthesis, critique and grounded chat.</text>
<rect x="1310" y="620" width="470" height="190" rx="22" fill="#FFFFFF" stroke="#6D5AA6" stroke-width="2"/>
<text x="1338" y="672" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Rebuildable sidecars</text>
<text x="1338" y="715" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#5F6B65">Pinecone stores accepted-evidence</text>
<text x="1338" y="744" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#5F6B65">vectors. Mem0 stores confirmed founder</text>
<text x="1338" y="773" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#5F6B65">preferences, goals and decisions.</text>
<line x1="375" y1="620" x2="375" y2="500" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="960" y1="620" x2="960" y2="500" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1545" y1="620" x2="1545" y2="500" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="70" y1="1002" x2="1850" y2="1002" stroke="#C9D0CC" stroke-width="2"/>
<text x="70" y="1046" text-anchor="start" font-family="Segoe UI, Arial" font-size="22" font-weight="400" fill="#5F6B65">The Supervisor never treats Pinecone or Mem0 as project truth; both are revalidated against Supabase.</text>
</svg>
<line x1="1485" y1="650" x2="1485" y2="530" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="70" y1="1002" x2="1850" y2="1002" stroke="#C9D0CC" stroke-width="2"/>
<text x="70" y="1046" text-anchor="start" font-family="Segoe UI, Arial" font-size="22" font-weight="400" fill="#5F6B65">Reads can run autonomously. Stage changes, reruns and external writes require founder approval.</text>
</svg>
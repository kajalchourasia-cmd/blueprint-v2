<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6B746F"/></marker></defs>
<text x="70" y="102" text-anchor="start" font-family="Segoe UI, Arial" font-size="48" font-weight="600" fill="#17201C">Evaluation, Observability and Release Gates</text>
<text x="70" y="141" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Blueprint measures workflow completion, grounding and recovery—not a single attractive answer</text>
<line x1="70" y1="165" x2="1850" y2="165" stroke="#C9D0CC" stroke-width="2"/>
<rect x="70" y="230" width="400" height="220" rx="22" fill="#E8F2ED" stroke="#176447" stroke-width="2"/>
<text x="98" y="282" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Contract tests</text>
<text x="98" y="327" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">35 Python tests for auth, API</text>
<text x="98" y="360" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">boundaries, deterministic</text>
<text x="98" y="393" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Foundation, navigation, titles</text>
<text x="98" y="426" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">and grounded chat fallbacks.</text>
<rect x="500" y="230" width="400" height="220" rx="22" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="2"/>
<text x="528" y="282" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Workflow structure</text>
<text x="528" y="327" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Node IDs, connection targets,</text>
<text x="528" y="360" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">code syntax, error bindings,</text>
<text x="528" y="393" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">secret scanning and schema</text>
<text x="528" y="426" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">contracts.</text>
<rect x="930" y="230" width="400" height="220" rx="22" fill="#F1EDF8" stroke="#6D5AA6" stroke-width="2"/>
<text x="958" y="282" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Agentic eval suite</text>
<text x="958" y="327" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">85 cases across scope,</text>
<text x="958" y="360" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">security, routing, state, HITL,</text>
<text x="958" y="393" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">grounding, memory, reruns,</text>
<text x="958" y="426" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">budgets and failures.</text>
<rect x="1360" y="230" width="490" height="220" rx="22" fill="#EAF1F8" stroke="#2D5F8B" stroke-width="2"/>
<text x="1388" y="282" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Live acceptance</text>
<text x="1388" y="327" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Fresh owner-scoped run, partial</text>
<text x="1388" y="360" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">visibility, gate resume, unhappy path,</text>
<text x="1388" y="393" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">state restoration and second-user</text>
<text x="1388" y="426" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">isolation.</text>
<text x="70" y="573" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="600" fill="#5F6B65">OBSERVABILITY ENVELOPE</text>
<rect x="70" y="595" width="1780" height="175" rx="22" fill="#F5F7F5" stroke="#C9D0CC" stroke-width="2"/>
<text x="98" y="647" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Recorded per route</text>
<text x="98" y="692" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">owner / project / run • task and attempt • selected tool/model • start/end/latency • evidence result • retry/repair reason • checkpoint • final status</text>
<rect x="230" y="825" width="440" height="130" rx="22" fill="#FFFFFF" stroke="#9A6A14" stroke-width="2"/>
<text x="258" y="877" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Release gate 1</text>
<text x="258" y="919" text-anchor="start" font-family="Segoe UI, Arial" font-size="22" font-weight="400" fill="#5F6B65">No unsupported claim affects a verdict.</text>
<rect x="740" y="825" width="440" height="130" rx="22" fill="#FFFFFF" stroke="#176447" stroke-width="2"/>
<text x="768" y="877" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Release gate 2</text>
<text x="768" y="917" text-anchor="start" font-family="Segoe UI, Arial" font-size="20" font-weight="400" fill="#5F6B65">No write or stage advance bypasses HITL.</text>
<rect x="1250" y="825" width="440" height="130" rx="22" fill="#FFFFFF" stroke="#A94840" stroke-width="2"/>
<text x="1278" y="877" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Release gate 3</text>
<text x="1278" y="917" text-anchor="start" font-family="Segoe UI, Arial" font-size="20" font-weight="400" fill="#5F6B65">Happy and unhappy paths both terminate</text>
<text x="1278" y="942" text-anchor="start" font-family="Segoe UI, Arial" font-size="20" font-weight="400" fill="#5F6B65">clearly.</text>
<line x1="70" y1="1002" x2="1850" y2="1002" stroke="#C9D0CC" stroke-width="2"/>
<text x="70" y="1046" text-anchor="start" font-family="Segoe UI, Arial" font-size="22" font-weight="400" fill="#5F6B65">Current automated acceptance after this documentation pass: 35/35 Python tests and 85/85 agentic eval cases.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6B746F"/></marker></defs>
<text x="70" y="102" text-anchor="start" font-family="Segoe UI, Arial" font-size="48" font-weight="600" fill="#17201C">Blueprint — Canonical Data Model</text>
<text x="70" y="141" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">Supabase owns project truth; execution, evidence, decisions and experience remain traceable</text>
<line x1="70" y1="165" x2="1850" y2="165" stroke="#C9D0CC" stroke-width="2"/>
<rect x="70" y="220" width="350" height="180" rx="22" fill="#E8F2ED" stroke="#176447" stroke-width="2"/>
<text x="98" y="272" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Identity + project</text>
<text x="98" y="317" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">auth.users → projects →</text>
<text x="98" y="350" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">project_profiles</text>
<rect x="500" y="220" width="350" height="180" rx="22" fill="#EAF1F8" stroke="#2D5F8B" stroke-width="2"/>
<text x="528" y="272" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Execution</text>
<text x="528" y="316" text-anchor="start" font-family="Segoe UI, Arial" font-size="24" font-weight="400" fill="#5F6B65">runs → orchestration_tasks</text>
<text x="528" y="347" text-anchor="start" font-family="Segoe UI, Arial" font-size="24" font-weight="400" fill="#5F6B65">→ task_observations</text>
<rect x="930" y="220" width="350" height="180" rx="22" fill="#F1EDF8" stroke="#6D5AA6" stroke-width="2"/>
<text x="958" y="272" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Evidence</text>
<text x="958" y="315" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#5F6B65">evidence → hypotheses /</text>
<text x="958" y="344" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#5F6B65">competitors →</text>
<text x="958" y="373" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#5F6B65">blueprint_sections</text>
<rect x="1360" y="220" width="490" height="180" rx="22" fill="#FBF3DD" stroke="#9A6A14" stroke-width="2"/>
<text x="1388" y="272" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Decisions + versions</text>
<text x="1388" y="317" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">stage_verdicts → human_checkpoints</text>
<text x="1388" y="350" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">→ blueprint_versions</text>
<line x1="420" y1="310" x2="480" y2="310" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="850" y1="310" x2="910" y2="310" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1280" y1="310" x2="1340" y2="310" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<text x="70" y="523" text-anchor="start" font-family="Segoe UI, Arial" font-size="23" font-weight="600" fill="#5F6B65">SUPPORTING RELATIONSHIPS</text>
<rect x="70" y="550" width="400" height="190" rx="22" fill="#FFFFFF" stroke="#C9D0CC" stroke-width="2"/>
<text x="98" y="602" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Observability</text>
<text x="98" y="647" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">agent_runs • tool_calls •</text>
<text x="98" y="680" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">state_transitions • errors •</text>
<text x="98" y="713" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">quality_checks</text>
<rect x="520" y="550" width="400" height="190" rx="22" fill="#FFFFFF" stroke="#176447" stroke-width="2"/>
<text x="548" y="602" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Founder control</text>
<text x="548" y="647" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">approvals • rerun_requests •</text>
<text x="548" y="680" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">next_actions •</text>
<text x="548" y="713" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">dashboard_signals</text>
<rect x="970" y="550" width="400" height="190" rx="22" fill="#FFFFFF" stroke="#2D5F8B" stroke-width="2"/>
<text x="998" y="602" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Grounded conversation</text>
<text x="998" y="647" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">chat_threads • chat_messages</text>
<text x="998" y="680" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">• accepted evidence IDs</text>
<rect x="1420" y="550" width="430" height="190" rx="22" fill="#FFFFFF" stroke="#6D5AA6" stroke-width="2"/>
<text x="1448" y="602" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Rebuildable projections</text>
<text x="1448" y="647" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">memory_projections → Pinecone</text>
<text x="1448" y="680" text-anchor="start" font-family="Segoe UI, Arial" font-size="25" font-weight="400" fill="#5F6B65">/ Mem0 synchronization</text>
<line x1="270" y1="550" x2="270" y2="430" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="720" y1="550" x2="720" y2="430" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1170" y1="550" x2="1170" y2="430" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1635" y1="550" x2="1635" y2="430" stroke="#6B746F" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="245" y="810" width="1430" height="120" rx="22" fill="#F5F7F5" stroke="#C9D0CC" stroke-width="2"/>
<text x="273" y="862" text-anchor="start" font-family="Segoe UI, Arial" font-size="29" font-weight="600" fill="#17201C">Ownership invariant</text>
<text x="273" y="902" text-anchor="start" font-family="Segoe UI, Arial" font-size="20" font-weight="400" fill="#5F6B65">Every durable row is scoped through owner_id, project_id and run_id. Pinecone and Mem0 can be rebuilt; neither can overwrite canonical Supabase truth.</text>
<line x1="70" y1="1002" x2="1850" y2="1002" stroke="#C9D0CC" stroke-width="2"/>
<text x="70" y="1046" text-anchor="start" font-family="Segoe UI, Arial" font-size="22" font-weight="400" fill="#5F6B65">The model stores inputs, evidence, route reasons, approvals and outcomes — never raw chain of thought or provider credentials.</text>
</svg>